production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  project_recurrences:
    class: ProjectRecurrenceJob
    schedule: "0 6 * * * UTC"
  weekly_project_digests:
    class: WeeklyProjectDigestJob
    schedule: "0 7 * * 1 UTC"
  slot_reminders:
    class: SlotReminderJob
    schedule: at 7am every day
  purge_unattached_blobs:
    class: PurgeUnattachedBlobsJob
    schedule: at 2am every day
  demo_organization_reset:
    class: DemoResetJob
    schedule: at 3am every day

development:
  demo_organization_reset:
    class: DemoResetJob
    schedule: at 3am every day
