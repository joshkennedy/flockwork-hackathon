<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F3F2EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
    <title>Browser not supported | Flockwork</title>
    <style>
      :root { color-scheme: light dark; --frame: #F3F2EF; --panel: #FFFFFF; --border: #E6E4E0; --ink: #141413; --ink-2: #5F5E5A; --mark: #D69000; --button-ink: #FFFFFF; --button-hover: #30302D; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--frame); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      main { min-height: 100dvh; padding: 8px; }
      .panel { min-height: calc(100dvh - 16px); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: grid; grid-template-rows: auto 1fr; padding: 28px; }
      .brand { color: var(--ink); display: inline-flex; align-items: center; gap: 8px; width: fit-content; font-size: 18px; font-weight: 750; letter-spacing: -0.01em; line-height: 24px; text-decoration: none; }
      .brand svg { display: block; width: 28px; height: auto; }
      .message { align-self: center; max-width: 560px; padding: 56px 0 96px clamp(0px, 7vw, 96px); }
      h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 650; letter-spacing: -0.035em; line-height: 1.08; margin: 0; text-wrap: balance; }
      .copy { color: var(--ink-2); font-size: 16px; line-height: 24px; margin: 16px 0 28px; max-width: 38ch; }
      .home { background: var(--ink); border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 1px rgba(20,20,19,.12), 0 2px 6px rgba(20,20,19,.12); color: var(--button-ink); display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600; text-decoration: none; }
      .home:hover { background: var(--button-hover); }
      .home:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      @media (max-width: 480px) { .panel { padding: 20px; } .message { padding: 48px 0 72px; } h1 { font-size: 30px; line-height: 36px; } .home { width: 100%; } }
      @media (prefers-color-scheme: dark) { :root { --frame: #141413; --panel: #1D1D1B; --border: #2E2D2A; --ink: #F2F1ED; --ink-2: #AAA8A2; --mark: #F5B000; --button-ink: #141413; --button-hover: #DAD9D4; } .home { box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 1px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.22); } }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="error-title">
        <a class="brand" href="/" aria-label="Flockwork home">
          <svg viewBox="0.9 5.85 22.2 12.1" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8.21 10.54 12 7.66l3.79 2.88" stroke="var(--mark)" stroke-width="3.22"/><path d="M2.5 16.35 5.8 13.85l3.3 2.5M14.9 16.35l3.3-2.5 3.3 2.5" stroke="var(--ink)" stroke-width="2.8"/></g></svg>
          <span>Flockwork</span>
        </a>
        <div class="message">
          <h1 id="error-title">This browser can’t run Flockwork.</h1>
          <p class="copy">Update your browser, then try again.</p>
          <a class="home" href="/">Back Home</a>
        </div>
      </section>
    </main>
  </body>
</html>
